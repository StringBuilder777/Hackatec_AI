version: "3.9"

services:

  # ─── Backend Python ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: stringbuilder-backend
    working_dir: /app
    volumes:
      - ./backend:/app                      # hot reload en desarrollo
      - ./frontend:/app/frontend            # sirve el frontend estático
      - stringbuilder-data:/app/data        # persistencia TinyDB
      - stringbuilder-skills:/app/skills    # skills generados
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - PORT=${PORT:-8080}
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Redis (cache de sesiones activas) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stringbuilder-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

volumes:
  stringbuilder-data:
  stringbuilder-skills: